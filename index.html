        function autoFixTruncatedJSON(str) {
            let fixed = String(str || '').trim().replace(/^\uFEFF/, '');
            for(let i=0; i<30; i++) {
                try { JSON.parse(fixed); return fixed; } catch(e) {}
                try { JSON.parse(fixed + '}'); fixed += '}'; continue; } catch(e) {}
                try { JSON.parse(fixed + ']'); fixed += ']'; continue; } catch(e) {}
                try { JSON.parse(fixed + '"}'); fixed += '"}'; continue; } catch(e) {}
                try { JSON.parse(fixed + '"}]'); fixed += '"}]'; continue; } catch(e) {}
                break;
            }
            return fixed;
        }

        function extractJsonLikeText(content) {
            const raw = String(content || '').trim().replace(/^\uFEFF/, '');
            if (!raw) return raw;
            const firstObj = raw.indexOf('{');
            const firstArr = raw.indexOf('[');
            let start = -1;
            if (firstObj >= 0 && firstArr >= 0) start = Math.min(firstObj, firstArr);
            else start = Math.max(firstObj, firstArr);
            if (start > 0) {
                const lastObj = raw.lastIndexOf('}');
                const lastArr = raw.lastIndexOf(']');
                const end = Math.max(lastObj, lastArr);
                if (end > start) return raw.slice(start, end + 1);
            }
            return raw;
        }

        function tryParseBackupContent(content) {
            // 1 标准 JSON；2 截取 JSON 主体；3 修复残缺；4 localStorage 导出字符串
            const candidates = [];
            const raw = String(content || '').replace(/^\uFEFF/, '');
            candidates.push(raw);
            const extracted = extractJsonLikeText(raw);
            if (extracted !== raw) candidates.push(extracted);
            candidates.push(autoFixTruncatedJSON(extracted));

            for (let text of candidates) {
                if (!text) continue;
                try { return JSON.parse(text); } catch(e) {}
            }
            return null;
        }



        function findClassArraysDeep(value, depth = 0) {
            // 兜底扫描：无论备份外面包了几层，只要里面有班级数组就抓出来
            if (depth > 5 || value === null || value === undefined) return null;
            const direct = normalizeClassArray(value);
            if (Array.isArray(direct) && direct.length) return direct;
            const unwrapped = unwrapMaybeJson(value);
            if (unwrapped !== value) {
                const nested = findClassArraysDeep(unwrapped, depth + 1);
                if (Array.isArray(nested) && nested.length) return nested;
            }
            if (Array.isArray(value)) {
                const classLikeItems = value.filter(looksLikeClass);
                if (classLikeItems.length) return normalizeClassArray(classLikeItems);
                for (const item of value) {
                    const nested = findClassArraysDeep(item, depth + 1);
                    if (Array.isArray(nested) && nested.length) return nested;
                }
            }
            if (value && typeof value === 'object') {
                const priorityKeys = [
                    'classesData','classes','classData','classList','data','list','records','items','backup','payload',
                    'geminiClassData_v10','geminiClassData_v9','geminiClassData_v8','geminiClassData_v7','geminiClassData_v6',
                    'geminiClassData_v5_5','geminiClassData_v5_4','geminiClassData_v5_3','geminiClassData_v5_2','geminiClassData_v5_1','geminiClassData_v5','geminiClassData_v4'
                ];
                for (const key of priorityKeys) {
                    if (Object.prototype.hasOwnProperty.call(value, key)) {
                        const nested = findClassArraysDeep(value[key], depth + 1);
                        if (Array.isArray(nested) && nested.length) return nested;
                    }
                }
                for (const key of Object.keys(value)) {
                    const nested = findClassArraysDeep(value[key], depth + 1);
                    if (Array.isArray(nested) && nested.length) return nested;
                }
            }
            return null;
        }

        function commitImportedClasses(importedClasses) {
            const normalized = normalizeClassArray(importedClasses);
            if (!Array.isArray(normalized) || !normalized.length) return false;
            
            classesData = normalized;
            // 导入旧备份时也立即把课次顺序整理正确。
            sortAllClassSessions();
            activeClassId = String(classesData[0].id);
            try {
                // 导入新数据前，先大扫除
                clearLegacyMemory();
                const jsonStr = JSON.stringify(classesData);
                const finalData = typeof LZString !== 'undefined' ? LZString.compressToUTF16(jsonStr) : jsonStr;
                localStorage.setItem('geminiClassData_v8', finalData);
                localStorage.setItem('geminiActiveClassId_v8', activeClassId);
            } catch(e) {
                alert('⚠️ 浏览器本地存储空间已达极限！即使压缩也存不下了。\n请先用记事本打开 JSON 文件，删掉一些旧的结转记录后再尝试导入。');
            }
            renderAllClasses();
            return true;
        }

        function importAllJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const content = e.target.result;
                    const parsed = tryParseBackupContent(content);
                    let importedClasses = null;

                    // 逐级兜底：标准 JSON → 原始文本 → 深度扫描
                    importedClasses = normalizeClassArray(parsed);
                    if (!Array.isArray(importedClasses) || !importedClasses.length) importedClasses = normalizeClassArray(content);
                    if (!Array.isArray(importedClasses) || !importedClasses.length) importedClasses = findClassArraysDeep(parsed);
                    if (!Array.isArray(importedClasses) || !importedClasses.length) importedClasses = findClassArraysDeep(content);

                    if (Array.isArray(importedClasses) && importedClasses.length && commitImportedClasses(importedClasses)) {
                        const names = classesData.slice(0, 5).map(c => c.name || '未命名班级').join('、');
                        alert(`✅ 导入成功！已读取 ${classesData.length} 个班级。\n\n已导入：${names}${classesData.length > 5 ? '……' : ''}\n\n班级切换、一键结转、学生转班/归档、历史记录、缴费记录、CSV导出都保留。`);
                    } else {
                        alert("❌ 导入失败：没有识别到班级数据。\n\n这个版本已经支持旧版数组、带 history/archive 的备份、localStorage 整包和多层包裹 JSON。若仍失败，请把文件发我，我会继续按文件实际结构修。");
                    }
                } catch(err) {
                    alert("❌ 导入时出错：" + err.message + "\n\n当前表格数据没有被覆盖。");
                }
                document.getElementById('jsonFileInput').value = '';
            };
            reader.onerror = function() {
                alert('❌ 文件读取失败，请重新选择备份 JSON 文件。');
                document.getElementById('jsonFileInput').value = '';
            };
            reader.readAsText(file, 'UTF-8');
        }
    </script>
</body>
